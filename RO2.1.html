<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Trivia</title>
    <link rel="stylesheet" href="RO2.2.css">
</head>
<body>
    <div class="trivia">
        <div class="triviaQuestion">
            <h3>Trick Question!</h3>
            <p>What is the hottest planet in our solar system?</p>
        </div>
        <div class="selectAnswer">
            <button onclick="answer('mercury')">Mercury</button>
            <button onclick="answer('mars')">Mars</button>
            <button onclick="answer('venus')">Venus</button>
            <button onclick="answer('neptune')">Neptune</button>
        </div>
        <div class="displayAnswer">
            <p id="display"></p>
        </div>
    </div>
    <script src="RO2.3.js"></script>
</body>
</html>
