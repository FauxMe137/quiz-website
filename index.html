<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Trivia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="trivia">
        <div class="header">
            <h1>Simple Trivia</h1>
            <div class="grid-buttons">
                <button class="grid-btn">1</button>
                <button class="grid-btn">2</button>
                <button class="grid-btn">3</button>
                <button class="grid-btn">4</button>
                <button class="grid-btn">5</button>
                <button class="grid-btn">6</button>
                <button class="grid-btn">7</button>
                <button class="grid-btn">8</button>
                <button class="grid-btn">9</button>
                <button class="grid-btn">10</button>
                <button class="grid-btn">11</button>
                <button class="grid-btn">12</button>
                <button class="grid-btn">13</button>
                <button class="grid-btn">14</button>
                <button class="grid-btn">15</button>
                <button class="grid-btn">16</button>
                <button class="grid-btn">17</button>
                <button class="grid-btn">18</button>
                <button class="grid-btn">19</button>
                <button class="grid-btn">20</button>
            </div>
        </div>
        <div class="quiz">
            <h2 id="question">Question goes here</h2>
            <div id="answer-buttons">
                <button class="btn">Answer 1</button>
                <button class="btn">Answer 2</button>
                <button class="btn">Answer 3</button>
                <button class="btn">Answer 4</button>
            </div>
            <div class="nav-btns">
                <button id="prev-btn">Prev</button>
                <button id="next-btn">Prev</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
